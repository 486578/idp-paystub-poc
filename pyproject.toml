[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "paystub-agi"
version = "0.1.0"
description = "Paystub pre-tax deduction classification and AGI from evidence extracted with the IDP libraries."
requires-python = ">=3.14,<3.15"
dependencies = [
    "idp-core",
    "idp-ocr",
    "idp-genai",
    "pydantic==2.13.5",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov>=6.0",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "hypothesis>=6.100",
    "types-pyyaml>=6.0",
]

[tool.uv.sources]
idp-core = { git = "https://github.com/maximus-idp/idp-core", branch = "main" }
idp-ocr = { git = "https://github.com/maximus-idp/idp-ocr", branch = "feature/tables" }
idp-genai = { git = "https://github.com/maximus-idp/idp-genai", branch = "feature/bedrock-mantle" }

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
markers = [
    "integration: calls real AWS services or models; opt-in with -m integration",
]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "--disable-plugin-autoload",
    "-p", "pytest_cov",
    "-m", "not integration",
]

[tool.coverage.run]
source = ["paystub_agi"]
branch = true

[tool.ruff]
required-version = "==0.16.6"
target-version = "py314"
line-length = 88
extend-exclude = ["idp-paystub-model-comparison", "data", "*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["paystub_agi"]

[tool.mypy]
python_version = "3.14"
strict = true
files = [
    "$MYPY_CONFIG_FILE_DIR/src",
    "$MYPY_CONFIG_FILE_DIR/tests",
]

# Backend SDKs ship no type stubs; our own code stays strictly typed.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore.*", "jsonschema", "jsonschema.*", "pdfplumber", "pdfplumber.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

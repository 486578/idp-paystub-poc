# Harness settings example (DL-041). Copy to evaluation/config.yaml (git-ignored)
# and fill in the bucket. Credentials come only from your AWS profile (AWS_PROFILE).
aws:
  region: us-east-1
  retries:
    mode: adaptive         # standard | adaptive | legacy
    max_attempts: 5

s3:                        # only needed for the download command; omit for your own stub set
  bucket: example-bucket   # the bucket holding datasets/paystubs/
  stubs_prefix: datasets/paystubs/

paths:
  answer_keys: data/answer_keys
  paystubs: data/paystubs
  ocr_reads: data/ocr_reads
  results: data/results

component:                 # component settings; anything not listed keeps config/default.yaml
  extraction:
    send_images: never     # text only for now

textract:
  # sync (1-page only) | async (all staged in S3) | auto (sync; staged only for multi-page)
  mode: sync
  staging_bucket: null     # required for async and auto; same region as aws.region

models:                    # provider: converse (default) | mantle (only where required)
  # temperature: replaces extraction.temperature for that model; Opus 5 and Sonnet 5
  # reject any temperature (checked 2026-11-15), so theirs is null.
  # schema_method: tool (default) | prompt; Opus 5 mis-shaped its forced-tool answers.
  - {name: opus, model_id: us.anthropic.claude-opus-5, temperature: null, schema_method: prompt}
  - {name: sonnet, model_id: us.anthropic.claude-sonnet-5, temperature: null}
  - {name: gemma, model_id: google.gemma-3-27b-it, temperature: 0}
  - {name: gpt, model_id: openai.gpt-oss-120b-1:0, temperature: 0}

# Keys known to be wrong, as folder/stub (reported separately).
disputed_stubs:
  - advs_paystubs/stub_0010

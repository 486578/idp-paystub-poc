# Default settings for the paystub component (paystub_agi).
# Every value here equals the built-in default; a test keeps them in sync.
# Infrastructure (model, region, credentials, paths) never goes in this file.

reading:
  # Readers tried in this order until one gives a usable read (decisionlog DL-034).
  # "pdfplumber" (free, local) is built in; other names are supplied by the caller.
  strategy: [pdfplumber, textract]
  max_images: 3          # page images sent to a vision model
  image_dpi: 144
  image_max_side: 1568
  grayscale: true

rules:
  # Business answers of 2026-11-13 (decisionlog DL-021): no explicit pre-tax marker = post-tax.
  bare_benefit_names: not_pretax     # R9: pretax | not_pretax | needs_review
  ee_means: not_pretax               # R7: pretax | not_pretax | needs_review
  emp_means: employee                # R8: employee (later rules decide) | employer | pretax | needs_review
  asterisk_scope: any                # R6: any | uniform_only
  unclear_default: not_pretax        # R10: not_pretax | needs_review

  # Case-insensitive, whole-word matching. "pre tax" also matches "Pre-Tax".
  keywords:
    employer_markers: [er, err, employer, company paid, co paid]          # R1
    tax_labels:                                                            # R2
      - federal income tax
      - federal withholding
      - federal tax
      - fed tax
      - fed withholding
      - fit
      - fitw
      - social security
      - oasdi
      - fica
      - medicare
      - state income tax
      - state tax
      - sit
      - local tax
      - city tax
      - eit
      - lst
      - sdi
      - sui
      - suta
      - pfl
      - fli
    posttax_markers: [post tax, posttax, post, after tax, aftertax, roth]  # R3
    pretax_markers:                                                        # R4
      - pre tax
      - pretax
      - pre
      - pt
      - prtx
      - before tax
      - tax deferred
      - tax sheltered
      - tax exempt
      - non taxed
      - no tax
    posttax_categories: [garnish, garnishment, union dues, charity, charitable, child support]  # R5
    pretax_footnote_phrases:                                               # R6
      - pre tax
      - pretax
      - before tax
      - excluded from federal taxable wages
      - excluded from taxable wages
      - not taxable
      - non taxable
      - nontaxable
      - section 125
      - sec 125
      - tax exempt
      - tax deferred
    uniform_labels: [uniform]                                              # R6 uniform_only
    column_yes_values: [y, "yes", x, "true"]                               # R4: "Pre-Tax: Y"
    column_no_values: [n, "no", "false"]                                   # R3: "Pre-Tax: N"
    ee_codes: [ee]                                                         # R7
    emp_codes: [emp]                                                       # R8
    benefit_names:                                                         # R9
      - 401k
      - 403b
      - "457"
      - 457b
      - tsp
      - medical
      - health
      - dental
      - vision
      - hsa
      - fsa
      - hdhp
      - dependent care
      - transit
      - parking
      - commuter

agi:
  # AGI = (gross - one_time - pretax) x periods_per_year + one_time  (reference agi.py)
  one_time_earnings: [bonus, overtime]
  # Source doc: commission alone is regular pay; with other pay it's in the bonus column.
  commission_earnings: [commission]
  commission_with_other_pay: one_time   # one_time (counted once) | regular (annualised)
  # When federal taxable wages are printed, AGI comes from them (decisionlog DL-024).
  one_time_with_federal_wages: once     # once: (FTW - one_time) x periods + one_time | annualise: FTW x periods
  periods_per_year:
    weekly: 52
    biweekly: 26
    semimonthly: 24
    monthly: 12
    quarterly: 4
    annual: 1
    one_time: 1
  # Used only when no frequency is printed and the period dates don't give one.
  default_frequency: null

checks:
  # Checks flag inconsistencies; they never change extracted amounts (decisionlog DL-018).
  send_to_review: false        # true: flagged R9/R10 rows move to needs_review (DL-022)
  net_tolerance: 0.02          # gross - taxes - employee deductions vs printed net
  wage_tolerance: 1.00         # federal taxable wages, and payroll-tax implied wages vs gross
  social_security_rate: 0.062
  medicare_rate: 0.0145
  social_security_labels: [social security, oasdi, soc sec]
  medicare_labels: [medicare]
  # Benefits usually taken before Social Security/Medicare tax (Section 125).
  cafeteria_plan_names: [medical, health, dental, vision, hsa, fsa]
